name: Export Web & Deploy to Vercel

on:
  push:
    paths:
      - "apps/game/**"
      - "packages/**"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-deploy
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.6"
  GODOT_RELEASE: "stable"
  EXPORT_PRESET: "Web"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot ${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }} (headless)
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}"
          curl -fSL -o godot.zip "${BASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip"
          curl -fSL -o templates.tpz "${BASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"
          unzip -q templates.tpz
          mv templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}/"

      - name: Import project resources
        run: godot --headless --path apps/game --import --quit-after 200 || true

      - name: Export Web build
        run: |
          set -euo pipefail
          mkdir -p build
          # Absolute output path: with --path apps/game, Godot resolves a relative
          # export target against the project dir (apps/game/build), not the repo
          # root where we created build/. An absolute path is unambiguous.
          godot --headless --path apps/game --verbose --export-release "${EXPORT_PRESET}" "${GITHUB_WORKSPACE}/build/index.html"
          test -f build/index.html

      - name: Add Vercel config (cross-origin isolation headers for threads)
        run: cp apps/game/vercel.json build/vercel.json

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Runs before the copy below, so the generated pages and preview cards
      # land in apps/game/web/docs/ and get picked up with everything else.
      - name: Build docs from docs/*.md
        run: |
          set -euo pipefail
          bun run docs:build
          test -f apps/game/web/docs/index.html

      # Same reasoning: link-preview cards for /dashboard, /shop, /ideas etc.
      # need to exist before the copy below picks up apps/game/web/.
      - name: Build link-preview cards for the web shell
        run: |
          set -euo pipefail
          bun run previews:build
          test -f apps/game/web/dashboard/og.png

      - name: Add web pages (quests / hackatime / vault / timeline)
        run: |
          set -euo pipefail
          cp -r apps/game/web/. build/
          rm -f build/.gdignore
          mkdir -p build/fonts build/img
          cp apps/game/assets/fonts/Monocraft.ttf build/fonts/Monocraft.ttf
          cp apps/game/assets/npcs/cheetah_char.png build/img/cheetah_char.png
          cp apps/game/assets/ui/pixel_currency_red.png build/img/pixel.png

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TELEMETRY_DISABLED: "1"
        working-directory: build
        run: |
          set -euo pipefail
          npm i -g vercel@latest
          # build/ is already the finished static export, so don't ship it as
          # source and let Vercel build it remotely (that remote "Building…" step
          # is what hangs). Produce the Vercel output locally and deploy it as
          # prebuilt so Vercel just serves the files with no remote build.
          # --archive=tgz uploads one tarball instead of every file individually.
          vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
          vercel build --prod --token "$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --yes --archive=tgz --token "$VERCEL_TOKEN"
