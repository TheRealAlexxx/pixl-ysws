    <link rel="icon" href="/index.icon.png" />
    <link rel="stylesheet" href="/pixl.css" />
    <style>
      .hero {
        padding: 24px 28px;
        margin-top: 8px;
        display: flex;
        align-items: flex-end;
        gap: 20px;
        flex-wrap: wrap;
      }
      .hero-actions {
        margin-left: auto;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .ht-bar {
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
        margin: 20px 0;
        padding: 15px 20px 13px;
        font-size: 15px;
      }
      .ht-dot {
        width: 12px;
        height: 12px;
        border: 1px solid var(--stroke);
        border-radius: 50%;
      }
      .ht-dot.on {
        background: var(--good);
      }
      .ht-dot.off {
        background: var(--bad);
      }
      .ht-bars {
        margin: 6px 0 20px;
        display: none;
        flex-direction: column;
        gap: 10px;
        width: 100%;
      }
      .ht-bars.show {
        display: flex;
      }
      .ht-row {
        padding: 13px 18px 12px;
      }
      .ht-row .top {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 8px;
        font-size: 16px;
      }
      .bar {
        height: 14px;
        border: 1px solid var(--stroke);
        border-radius: 999px;
        background: var(--panel-deep);
        overflow: hidden;
      }
      .bar > div {
        height: 100%;
        background: repeating-linear-gradient(
          90deg,
          var(--gold) 0 10px,
          var(--gold-soft) 10px 20px
        );
      }
      .section-h {
        font-size: 20px;
        color: var(--gold);
        margin: 26px 0 16px;
        letter-spacing: 1px;
      }
      .invite-box {
        border: 1px solid var(--stroke);
        border-radius: var(--radius-sm);
        background: var(--panel);
        padding: 16px 20px;
        margin-bottom: 16px;
        display: flex;
        align-items: center;
        gap: 20px;
        flex-wrap: wrap;
      }
      .invite-box-head {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 200px;
      }
      .invite-box-title {
        font-family: var(--pixel, var(--sans));
        font-size: 14px;
        letter-spacing: 0.5px;
        color: var(--gold);
      }
      .invite-box-sub {
        font-family: var(--sans);
        font-size: 13px;
        color: var(--faint);
      }
      .invite-box-row {
        display: flex;
        gap: 10px;
        margin-left: auto;
        flex-wrap: wrap;
      }
      .invite-box-row .field {
        max-width: 180px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      @media (max-width: 560px) {
        .invite-box {
          flex-direction: column;
          align-items: stretch;
        }
        .invite-box-row {
          margin-left: 0;
        }
        .invite-box-row .field {
          max-width: none;
          flex: 1;
        }
      }
      .ysws-modal {
        position: fixed;
        inset: 0;
        z-index: 100000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }
      .ysws-modal-veil {
        position: absolute;
        inset: 0;
        background: rgba(10, 10, 14, 0.66);
        backdrop-filter: blur(2px);
      }
      .ysws-modal-box {
        position: relative;
        width: 100%;
        max-width: 540px;
        max-height: 86vh;
        overflow-y: auto;
        background: var(--panel);
        color: var(--ink);
        border: 2px solid var(--stroke);
        border-radius: 14px;
        padding: 22px;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
        animation: ysws-pop 0.16s ease;
      }
      @keyframes ysws-pop {
        from {
          transform: scale(0.96);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }
      .ysws-modal-title {
        font-family: var(--pixel, var(--sans));
        font-size: 17px;
        color: var(--gold);
        letter-spacing: 0.5px;
        margin-bottom: 10px;
      }
      .ysws-modal-body {
        font-size: 14px;
        line-height: 1.55;
        color: var(--dim);
      }
      .ysws-modal-acts {
        display: flex;
        justify-content: flex-end;
        margin-top: 18px;
      }
      .ysws-pick-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 16px;
        max-height: 44vh;
        overflow-y: auto;
      }
      .ysws-pick {
        display: flex;
        flex-direction: column;
        gap: 3px;
        width: 100%;
        text-align: left;
        padding: 11px 13px;
        border: 1px solid var(--stroke);
        border-radius: var(--radius-sm);
        background: none;
        cursor: pointer;
        transition:
          border-color 0.12s ease,
          background 0.12s ease;
      }
      .ysws-pick:hover:not(:disabled) {
        border-color: var(--gold);
        background: rgba(255, 255, 255, 0.03);
      }
      .ysws-pick:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .ysws-pick-name {
        font-family: var(--pixel, var(--sans));
        font-size: 13px;
        color: var(--ink);
        letter-spacing: 0.5px;
      }
      .ysws-pick-meta {
        font-size: 12px;
        color: var(--gold);
      }
      .ysws-pick-desc {
        font-size: 12px;
        line-height: 1.45;
        color: var(--faint);
      }
      .proj-thumb {
        height: 140px;
        border: 1px solid var(--stroke);
        border-radius: var(--radius-sm);
        background:
          repeating-conic-gradient(
              rgba(22, 22, 30, 0.05) 0% 25%,
              transparent 0% 50%
            )
            0 0 / 22px 22px,
          var(--panel-deep);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 40px;
        overflow: hidden;
      }
      .proj-thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .proj-name {
        font-size: 19px;
        color: var(--ink);
      }
      .proj-meta {
        font-size: 14.5px;
        color: var(--faint);
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
      }
      /* full-width project rows */
      .proj-rows {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .proj-row {
        display: flex;
        gap: 20px;
        align-items: stretch;
        padding: 16px 18px;
        width: 100%;
      }
      .proj-row-thumb {
        width: 200px;
        flex-shrink: 0;
        align-self: stretch;
        min-height: 120px;
        border: 1px solid var(--stroke);
        border-radius: var(--radius-sm);
        background:
          repeating-conic-gradient(
              rgba(22, 22, 30, 0.05) 0% 25%,
              transparent 0% 50%
            )
            0 0 / 22px 22px,
          var(--panel-deep);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 44px;
        overflow: hidden;
      }
      .proj-row-thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .proj-row-body {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 9px;
      }
      .proj-row-head {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .proj-row-head .proj-name {
        font-size: 22px;
      }
      .proj-row-arrow {
        align-self: center;
        color: var(--faint);
        font-size: 30px;
        flex-shrink: 0;
      }
      .proj-row:hover .proj-row-arrow {
        color: var(--gold);
      }
      .proj-row .note-strip {
        margin-top: 2px;
      }
      @media (max-width: 560px) {
        .proj-row {
          flex-direction: column;
          gap: 12px;
        }
        .proj-row-thumb {
          width: 100%;
          height: 160px;
        }
        .proj-row-arrow {
          display: none;
        }
      }
      .note-strip {
        font-family: var(--sans);
        font-size: 13.5px;
        line-height: 1.6;
        padding: 10px 12px;
        border: 1px solid var(--stroke);
        border-radius: var(--radius-sm);
        background: color-mix(in srgb, var(--bad) 12%, var(--panel));
        color: var(--bad);
      }
      .note-strip.teal {
        background: color-mix(in srgb, var(--teal) 12%, var(--panel));
        color: var(--teal);
      }
      .trial-brief {
        border: 1px solid color-mix(in srgb, var(--gold) 45%, var(--stroke));
        border-radius: var(--radius-sm);
        background: color-mix(in srgb, var(--gold) 9%, var(--panel));
        padding: 14px 16px;
        margin-bottom: 16px;
      }
      .trial-brief-h {
        font-family: var(--pixel, var(--sans));
        color: var(--gold);
        font-size: 15px;
        letter-spacing: 0.02em;
        margin-bottom: 8px;
      }
      .trial-brief-desc {
        font-family: var(--sans);
        font-size: 14px;
        line-height: 1.6;
        margin: 0 0 8px;
      }
      .trial-brief-reward {
        font-family: var(--sans);
        font-size: 13.5px;
        color: var(--teal);
        margin-bottom: 8px;
      }
      .trial-brief-note {
        font-family: var(--sans);
        font-size: 12.5px;
        line-height: 1.5;
        opacity: 0.75;
      }
      .tl-list {
        display: flex;
        flex-direction: column;
        margin-top: 6px;
      }
      .tl-item {
        position: relative;
        padding: 0 0 16px 26px;
      }
      .tl-item::before {
        content: "";
        position: absolute;
        left: 8px;
        top: 6px;
        bottom: -2px;
        width: 2px;
        background: var(--stroke);
      }
      .tl-item:last-child::before {
        display: none;
      }
      .tl-dot {
        position: absolute;
        left: 3px;
        top: 5px;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--faint);
        box-shadow: 0 0 0 3px var(--panel);
      }
      .tl-dot.ok {
        background: var(--good);
      }
      .tl-dot.rev {
        background: var(--teal);
      }
      .tl-dot.warn {
        background: var(--gold);
      }
      .tl-dot.bad {
        background: var(--bad);
      }
      .tl-head {
        display: flex;
        gap: 10px;
        align-items: baseline;
        flex-wrap: wrap;
      }
      .tl-title {
        font-family: var(--sans);
        font-weight: 700;
        font-size: 14.5px;
        color: var(--ink);
      }
      .tl-time {
        font-family: var(--sans);
        font-size: 12px;
        color: var(--faint);
      }
      .tl-hours {
        font-family: var(--sans);
        font-size: 13px;
        color: var(--teal);
        margin-top: 2px;
      }
      .tl-cut {
        color: var(--bad);
      }
      .tl-note {
        font-family: var(--sans);
        font-size: 13.5px;
        line-height: 1.6;
        margin-top: 6px;
        padding: 8px 11px;
        border: 1px solid var(--stroke);
        border-radius: var(--radius-sm);
        background: var(--panel-deep);
        color: var(--ink);
        white-space: pre-wrap;
        word-break: break-word;
      }
      .editor {
        width: 100%;
      }
      .back-btn {
        margin-bottom: 18px;
      }
      .form-grid {
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding: 24px;
      }
      .form-row {
        display: flex;
        flex-direction: column;
        gap: 7px;
      }
      .form-row label {
        font-size: 13px;
        color: var(--faint);
        letter-spacing: 0.5px;
      }
      .open-link {
        font-size: 12px;
        color: var(--teal);
        margin-left: 6px;
        letter-spacing: 0;
      }
      .open-link:hover {
        color: var(--gold);
      }
      .form-row input.field,
      .form-row textarea.field {
        font-size: 15.5px;
      }
      .form-row textarea.field {
        resize: vertical;
        min-height: 80px;
        line-height: 1.6;
      }
      #j-content {
        min-height: 150px;
        resize: none;
        overflow: hidden;
        line-height: 1.6;
      }
      .two-col {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      @media (max-width: 640px) {
        .two-col {
          grid-template-columns: 1fr;
        }
      }
      .level-row {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
      }
      @media (max-width: 640px) {
        .level-row {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      .level-btn {
        border: 1px solid var(--stroke);
        border-radius: var(--radius-sm);
        background: var(--panel-deep);
        color: var(--dim);
        font-size: 15px;
        padding: 12px 8px 10px;
        text-align: center;
      }
      .level-btn small {
        display: block;
        font-size: 12px;
        color: var(--faint);
        margin-top: 5px;
        line-height: 1.45;
      }
      .level-btn.sel {
        background: var(--gold);
        color: var(--btn-ink);
      }
      .level-btn.sel small {
        color: rgba(43, 29, 18, 0.72);
      }
      .thumb-box {
        display: flex;
        gap: 16px;
        align-items: flex-start;
        flex-wrap: wrap;
      }
      .thumb-preview {
        width: 200px;
        height: 130px;
        border: 1px solid var(--stroke);
        border-radius: var(--radius-sm);
        background:
          repeating-conic-gradient(
              rgba(22, 22, 30, 0.05) 0% 25%,
              transparent 0% 50%
            )
            0 0 / 20px 20px,
          var(--panel-deep);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        font-size: 30px;
      }
      .thumb-preview img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .ht-pick {
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-height: 220px;
        overflow-y: auto;
        border: 1px solid var(--stroke);
        border-radius: var(--radius-sm);
        background: var(--panel-deep);
        padding: 10px;
      }
      .ht-pick label {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 15px;
        color: var(--ink);
        letter-spacing: 0;
        padding: 3px 0;
      }
      .ht-pick input {
        accent-color: var(--gold);
        width: 17px;
        height: 17px;
      }
      .ht-pick .h {
        margin-left: auto;
        color: var(--teal);
        font-size: 14px;
      }
      .check-row {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 15.5px;
        color: var(--ink);
      }
      .check-row input {
        accent-color: var(--gold);
        width: 18px;
        height: 18px;
        flex-shrink: 0;
      }
      .disclosure {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 15px 17px;
        border: 1px solid var(--stroke);
        border-radius: var(--radius-sm);
        background: var(--panel-deep);
      }
      .disclosure.update {
        background: color-mix(in srgb, var(--gold) 6%, var(--panel-deep));
        border-color: color-mix(in srgb, var(--gold) 35%, var(--stroke));
      }
      .disclosure-check {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 15.5px;
        font-weight: 600;
        color: var(--ink);
      }
      .disclosure.update > .disclosure-check:first-child {
        color: var(--gold);
      }
      .disclosure-check input {
        accent-color: var(--gold);
        width: 18px;
        height: 18px;
        flex-shrink: 0;
      }
      .disclosure-desc {
        font-size: 13.5px;
        line-height: 1.6;
        color: var(--faint);
        margin: -2px 0 2px;
      }
      .ta-wrap {
        position: relative;
        width: 100%;
      }
      .ta-wrap textarea.field {
        display: block;
        width: 100%;
        box-sizing: border-box;
      }
      .ta-count {
        position: absolute;
        bottom: 8px;
        right: 12px;
        font-size: 11.5px;
        color: var(--faint);
        pointer-events: none;
        background: var(--panel-deep);
        padding: 0 3px;
      }
      .ta-count.full {
        color: var(--bad);
      }
      .ship-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
        font-size: 15.5px;
      }
      .ship-item {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .ship-item .ok {
        color: var(--good);
      }
      .ship-item .no {
        color: var(--bad);
      }
      .journal-entry {
        padding: 14px 16px;
      }
      .journal-entry .jmeta {
        font-size: 13px;
        color: var(--faint);
        margin-bottom: 8px;
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .journal-entry .jdel {
        margin-left: auto;
        background: none;
        border: none;
        color: var(--faint);
        font-size: 13px;
      }
      .journal-entry .jdel:hover {
        color: var(--bad);
      }
      .journal-entry .jbody {
        font-size: 15.5px;
        word-break: break-word;
      }
      .jbody img,
      .jbody .bb-img {
        max-width: 100%;
        max-height: 260px;
      }
      .composer {
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .md-editor {
        display: flex;
        flex-direction: column;
      }
      .md-bar {
        display: flex;
        gap: 5px;
        align-items: center;
        flex-wrap: wrap;
        padding: 7px 8px;
        background: var(--panel-deep);
        border: 1px solid var(--stroke);
        border-bottom-width: 0;
        border-radius: var(--radius-sm) var(--radius-sm) 0 0;
      }
      .md-btn {
        font-family: var(--pixel);
        font-size: 13px;
        line-height: 1;
        min-width: 30px;
        height: 28px;
        padding: 0 9px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        background: var(--panel);
        color: var(--ink);
        border: 1px solid var(--stroke);
        border-radius: 6px;
        transition: background .15s ease, color .15s ease, border-color .15s ease;
      }
      .md-btn:hover {
        background: var(--gold);
        color: var(--btn-ink);
        border-color: var(--gold);
      }
      .md-btn.active {
        background: var(--gold);
        color: var(--btn-ink);
        border-color: var(--gold);
      }
      .md-btn i {
        font-style: italic;
      }
      .md-sep {
        width: 2px;
        align-self: stretch;
        margin: 1px 3px;
        background: var(--stroke);
        opacity: 0.3;
      }
      .md-preview {
        border: 1px solid var(--stroke);
        border-top-width: 0;
        border-radius: 0 0 var(--radius-sm) var(--radius-sm);
        background: var(--panel-deep);
        padding: 12px 14px;
        min-height: 140px;
        font-size: 15.5px;
        line-height: 1.6;
        word-break: break-word;
      }
      .md-preview img {
        max-width: 100%;
        max-height: 260px;
      }
      .md-preview .faint {
        font-size: 14px;
      }
      .composer-foot {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      .j-hint {
        font-size: 12.5px;
      }
      .j-hint.bad {
        color: var(--bad);
      }
      .j-hint.ok {
        color: var(--good);
      }
      .composer-foot .btn:last-child {
        margin-left: auto;
      }
      .composer-foot input.field {
        width: 90px;
      }
      .danger-zone {
        margin-top: 30px;
        padding: 14px 18px;
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
      }
      .btn.red {
        background: var(--bad);
        color: var(--btn-ink);
      }
      .status-approved {
        color: var(--good);
      }
      .status-shipped {
        color: var(--teal);
      }
      .status-needs {
        color: var(--bad);
      }
      .earned {
        color: var(--gold);
      }
      .connect-card {
        padding: 40px 30px;
        text-align: center;
        max-width: 560px;
        margin: 20px auto;
      }
      .connect-card h2 {
        color: var(--gold);
        font-size: 24px;
        margin-bottom: 12px;
      }
      .connect-card p {
        color: var(--dim);
        font-size: 14px;
        line-height: 1.8;
        margin-bottom: 22px;
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <section class="hero hud deep">
        <div>
          <h1 class="page-title">PROJECTS</h1>
          <div class="page-sub">
            BUILD · JOURNAL · SHIP · GET PAID IN PIXELS.
          </div>
        </div>
        <div class="hero-actions">
          <a class="btn" href="#new" id="new-btn">+ NEW PROJECT</a>
        </div>
      </section>

      <div id="ht-slot"></div>
      <div id="invites-slot"></div>
      <div id="join-code-slot"></div>
      <div id="ysws-import-slot"></div>
      <div class="spin" id="loading"></div>
      <div id="view"></div>
    </main>

    <script src="/pixl.js"></script>
    <script>
      Pixl.mountTopbar("projects");
      Pixl.loadWallet();

      const $ = (id) => document.getElementById(id);
      // Rates come off config so they can't drift from what the server pays.
      const RE_RATES = Pixl.config.economy.tierRePerHour;
      const LEVELS = [
        ["T1 Spark", "A first spark of Restoration: a simple site, script, or tiny tool."],
        ["T2 Signal", "A focused app, CLI, or game with clean polish — one system back online."],
        ["T3 Grid", "Multiple systems working together: backend, state, infra."],
        ["T4 Beacon", "Deep systems work: complex architecture and serious scope."],
      ].map(([name, blurb], i) => [name, `${blurb} ${RE_RATES[i]} RE per hour.`]);
      const ERRORS = {
        name_required: "Give it a name first.",
        repo_not_github: "The repo link must be a GitHub repository.",
        ai_notes_required: "Describe how you used AI (at least 10 characters).",
        repo_required: "Add a GitHub repo link before shipping.",
        demo_required: "Add a demo / playable link before shipping.",
        image_required: "Upload a thumbnail before shipping.",
        repo_not_found: "That repo link doesn't load — is it public?",
        demo_unreachable: "The demo link is unreachable.",
        demo_is_repo: "The demo can't be your GitHub repo. Use a playable build or a Releases page.",
        demo_invalid: "That demo link isn't a valid URL.",
        hackatime_hours_required:
          "Link Hackatime projects with at least 1 hour of coding first.",
        hackatime_unavailable:
          "Hackatime is unreachable right now — try again in a bit.",
        update_notes_required: "Describe what changed in this update.",
        update_notes_too_short: "Update notes need at least 100 characters.",
        already_shipped: "This one is already in the review queue.",
        project_banned: "This project is banned and can't be shipped.",
        cdn_not_configured: "Image uploads aren't configured on the server.",
        cdn_failed: "Image upload failed — try again.",
        journal_too_short:
          "Log more detail — journals need ~100 characters per hour.",
        not_in_review: "This project isn't in review.",
        trial_hours_below_minimum: "This Trial needs more tracked hours before you can ship it.",
        eligibility_attestation_required: "Confirm this isn't a school assignment or paid Hack Club work before shipping.",
      };
      const err = (e) => ERRORS[e] || "Something went wrong — try again.";

      let stats = null;
      let projects = [];
      let trials = []; // Trials the player has accepted and not yet finished
      let activeTrial = null; // the Trial the player arrived to build for, if any
      let hasBirthday = true; // assume yes until we hear otherwise — avoids a flash of the banner
      let form = null;

      function statusInfo(p) {
        if (p.banned_at) return ["BANNED", "status-needs"];
        if (p.rejected_at) return ["REJECTED", "status-needs"];
        if (p.status === "approved") return ["APPROVED", "status-approved"];
        if (p.status === "shipped") return ["IN REVIEW", "status-shipped"];
        if (p.status === "needs_changes")
          return ["NEEDS CHANGES", "status-needs"];
        return ["DRAFT", "muted"];
      }

      function linkedSeconds(p) {
        if (!stats || !stats.connected) return 0;
        const linked = new Set(p.hackatime_projects || []);
        return stats.projects
          .filter((h) => linked.has(h.name))
          .reduce((s, h) => s + h.seconds, 0);
      }

      // Seconds from the Hackatime boxes currently ticked in the editor (which
      // may not be saved yet), so ship-readiness reflects what the player sees.
      // Uses secondsSinceCutoff when the server has computed it so this matches
      // what actually counts toward shipping (only time after the cutoff).
      // Same cutoff the server enforces (HACKATIME_CUTOFF in
      // apps/server/src/hackatime/api.ts) - both now read packages/config, so
      // this can no longer drift from it. Needed client-side so the UI can
      // explain *why* a linked project reads as 0h instead of just insisting
      // you link one.
      const HT_CUTOFF_MS = new Date(Pixl.config.hackatimeCutoff).getTime();
      const HT_CUTOFF_LABEL = new Intl.DateTimeFormat("en-US", {
        month: "short",
        day: "numeric",
        timeZone: "UTC",
      }).format(HT_CUTOFF_MS);

      function checkedHtBoxes() {
        return [...document.querySelectorAll('input[name="ht"]:checked')];
      }

      // `counted` is what the server will actually credit (time after the
      // cutoff); `total` is the projects' whole tracked time. They diverge
      // whenever someone's hours predate the cutoff — the usual reason a
      // player links projects and still can't ship.
      function checkedHtTotals() {
        if (!stats || !stats.connected) return { counted: 0, total: 0 };
        const checked = new Set(checkedHtBoxes().map((c) => c.value));
        const picked = stats.projects.filter((h) => checked.has(h.name));
        return {
          counted: picked.reduce(
            (s, h) => s + (h.secondsSinceCutoff ?? h.seconds),
            0,
          ),
          total: picked.reduce((s, h) => s + h.seconds, 0),
        };
      }

      function checkedHtSeconds() {
        return checkedHtTotals().counted;
      }

      // The blocker used to always read "link a Hackatime project with >= 1h",
      // which is baffling when you've linked ten of them — the hours are real,
      // they just fall before the cutoff (or the cutoff hasn't arrived yet).
      function htBlockerText() {
        const { counted, total } = checkedHtTotals();
        if (!stats || !stats.connected)
          return "connect Hackatime so your hours can count";
        if (total === 0) return "link a Hackatime project with ≥ 1h";
        // Only claim "all of it predates the cutoff" when none of it counts —
        // otherwise some time did land after the cutoff, just not enough yet.
        if (counted === 0)
          return Date.now() < HT_CUTOFF_MS
            ? `wait for ${HT_CUTOFF_LABEL} — only hours tracked from then on count, and your ${Pixl.hours(total)} is all logged before it`
            : `track time from ${HT_CUTOFF_LABEL} onward — your ${Pixl.hours(total)} was all logged before then`;
        return `≥ 1h tracked from ${HT_CUTOFF_LABEL} onward (you have ${Pixl.hours(counted)} of ${Pixl.hours(total)})`;
      }

      // Shared by the initial checklist render and the live refresh as boxes
      // are ticked, so the two can't drift apart.
      function shipHtLine() {
        const { counted, total } = checkedHtTotals();
        const ok = counted >= 3600;
        const detail =
          counted === total
            ? Pixl.hours(counted)
            : `${Pixl.hours(counted)} counts, ${Pixl.hours(total)} linked`;
        return `<span class="${ok ? "ok" : "no"}">${ok ? "+" : "-"}</span> ≥ 1h tracked from ${HT_CUTOFF_LABEL} onward <span class="teal">(${detail})</span>`;
      }

      // Sum of the currently-ticked Hackatime boxes, shown right next to the
      // picker so the player can see their proof-of-hours total without
      // scrolling down to the ship checklist.
      function updateHtTotal() {
        const el = $("f-ht-total");
        if (!el) return;
        if (!checkedHtBoxes().length) return void (el.textContent = "");
        const { counted, total } = checkedHtTotals();
        el.textContent =
          counted === total
            ? `${Pixl.hours(counted)} selected`
            : `${Pixl.hours(counted)} counts (of ${Pixl.hours(total)} — rest predates ${HT_CUTOFF_LABEL})`;
      }

      // Wires the Hackatime picker in whichever form it's rendered in (new
      // project or existing): keeps the running total next to the label in
      // sync and warns when a ticked project has time from before the
      // cutoff. `onChange` lets renderProject also refresh its ship checklist.
      function wireHtPicker(onChange) {
        updateHtTotal();
        document.querySelectorAll('input[name="ht"]').forEach((box) =>
          box.addEventListener("change", () => {
            if (box.checked && box.dataset.beforeCutoff === "1") {
              Pixl.toast(
                `"${box.value}" has coding time from before ${HT_CUTOFF_LABEL} — only time tracked after ${HT_CUTOFF_LABEL} will count toward shipping.`,
              );
            }
            updateHtTotal();
            if (onChange) onChange();
          }),
        );
      }

      /* ---------- hackatime strip ---------- */

      function renderHt() {
        const slot = $("ht-slot");
        if (!stats) {
          slot.innerHTML = "";
          return;
        }
        if (!stats.connected) {
          slot.innerHTML = `
      <div class="ht-bar panel">
        <span class="ht-dot off"></span>
        <span>HACKATIME NOT CONNECTED — hours can't be counted until you link it.${stats.error ? ` <span class="faint">(${Pixl.esc(stats.error)})</span>` : ""}</span>
        <a class="btn" style="margin-left:auto" href="${Pixl.apiUrl("/hackatime/connect")}" target="_blank" rel="noopener" id="ht-connect">🔌 CONNECT</a>
      </div>`;
          $("ht-connect").addEventListener("click", () => {
            Pixl.toast(
              "Finishing in the new tab — this page will refresh itself.",
            );
            const poll = setInterval(async () => {
              try {
                const d = await Pixl.api("/api/hackatime/stats");
                if (d.stats && d.stats.connected) {
                  clearInterval(poll);
                  location.reload();
                }
              } catch {}
            }, 3000);
            setTimeout(() => clearInterval(poll), 180000);
          });
          return;
        }
        const sorted = [...stats.projects].sort(
          (a, b) => b.seconds - a.seconds,
        );
        const top = sorted[0];
        slot.innerHTML = `
    <div class="ht-bar panel">
      <span class="ht-dot on"></span>
      <span>HACKATIME CONNECTED</span>
      <span class="teal">${Pixl.hours(stats.totalSeconds)} total</span>
      <span class="faint">·</span>
      <span class="muted">${stats.projects.length} tracked</span>
      <button class="btn ghost" style="margin-left:auto" id="ht-toggle">TIME PER PROJECT ▾</button>
      <a class="btn ghost" href="${Pixl.apiUrl("/hackatime/connect")}" target="_blank" rel="noopener">RECONNECT</a>
    </div>
    <div class="ht-bars" id="ht-bars">
      ${sorted
        .map(
          (p) => `
        <div class="ht-row panel">
          <div class="top"><span>${Pixl.esc(p.name)}</span><span class="teal">${Pixl.hours(p.seconds)}</span></div>
          <div class="bar"><div style="width:${top && top.seconds ? (p.seconds / top.seconds) * 100 : 0}%"></div></div>
        </div>`,
        )
        .join("")}
    </div>`;
        $("ht-toggle").addEventListener("click", () =>
          $("ht-bars").classList.toggle("show"),
        );
      }

      /* ---------- list view ---------- */

      function renderList() {
        $("new-btn").style.display = "";
        const view = $("view");
        if (projects.length === 0) {
          view.innerHTML = `
      <div class="connect-card panel">
        <div style="font-size:48px;margin-bottom:12px"></div>
        <h2>NO PROJECTS YET</h2>
        <p>Log what you're building, link it to Hackatime, journal as you go, then ship it for review — approved hours pay out in pixels.</p>
        <a class="btn" href="#new">+ START YOUR FIRST PROJECT</a>
      </div>`;
          return;
        }
        view.innerHTML = `
    <div class="section-h">MY PROJECTS · ${projects.length}</div>
    <div class="proj-rows">
      ${projects
        .map((p) => {
          const [label, cls] = statusInfo(p);
          const secs = linkedSeconds(p);
          return `
        <a class="card panel proj-row" href="#p=${p.id}">
          <div class="proj-row-thumb">${p.image_url ? `<img src="${Pixl.esc(p.image_url)}" alt="" loading="lazy" onerror="this.remove()">` : ""}</div>
          <div class="proj-row-body">
            <div class="proj-row-head">
              <span class="proj-name">${Pixl.esc(p.name)}</span>
              <span class="chip ${cls}">${label}</span>
              <span class="chip">${LEVELS[(p.level || 1) - 1][0]}</span>
            </div>
            <div class="proj-meta">
              ${secs ? `<span class="teal">${Pixl.hours(secs)} coded</span>` : `<span>no hackatime linked</span>`}
              ${p.pixels_earned ? `<span class="earned">+${Math.round(p.pixels_earned)} px earned</span>` : ""}
              <span>${Pixl.timeAgo(p.created_at)}</span>
            </div>
            ${p.status === "needs_changes" && p.review_note ? `<div class="note-strip">${Pixl.esc(p.review_note)}</div>` : ""}
            ${p.rejected_at && p.reject_reason ? `<div class="note-strip">${Pixl.esc(p.reject_reason)}</div>` : ""}
          </div>
          <div class="proj-row-arrow">›</div>
        </a>`;
        })
        .join("")}
    </div>`;
      }

      /* ---------- editor view ---------- */

      // Optional "which Trial is this for?" picker for the ship panel. Only the
      // Trials the player has accepted (plus whatever this project is already
      // linked to) are offered; empty when there's nothing to pick.
      function trialPickerHtml(p) {
        const opts = [...trials];
        const linkedId = p.sidequest_id != null ? Number(p.sidequest_id) : null;
        if (linkedId && !opts.some((t) => Number(t.id) === linkedId))
          opts.push({ id: linkedId, name: p.sidequest_name || "Linked Trial", region: "" });
        if (!opts.length) return "";
        // Default to the linked Trial, or auto-select the one accepted Trial.
        const current =
          linkedId != null ? linkedId : trials.length === 1 ? Number(trials[0].id) : "";
        const options = [`<option value="">Not for a Trial — my own idea</option>`]
          .concat(
            opts.map(
              (t) =>
                `<option value="${Number(t.id)}" ${Number(t.id) === current ? "selected" : ""}>${Pixl.esc(t.name)}${t.region ? " · " + Pixl.esc(t.region) : ""}</option>`,
            ),
          )
          .join("");
        return `
        <label class="check-row" style="flex-direction:column;align-items:flex-start;gap:6px">
          <span>Submitting this for a Trial?</span>
          <select class="field" id="s-trial" style="max-width:340px">${options}</select>
        </label>`;
      }

      function formHtml(p) {
        const linked = new Set(p.hackatime_projects || []);
        const htOpts =
          stats && stats.connected
            ? [...stats.projects]
                .sort((a, b) => b.seconds - a.seconds)
                .map(
                  (h) => `
        <label${h.beforeCutoff ? ` title="Only time coded after ${HT_CUTOFF_LABEL} counts toward shipping — this project has older activity mixed in."` : ""}><input type="checkbox" name="ht" value="${Pixl.esc(h.name)}" data-before-cutoff="${h.beforeCutoff ? "1" : ""}" ${linked.has(h.name) ? "checked" : ""}>
        ${Pixl.esc(h.name)}<span class="h">${Pixl.hours(h.seconds)}</span>${h.beforeCutoff ? `<span class="faint" style="font-size:11px"> ⚠ only time after ${HT_CUTOFF_LABEL} counts</span>` : ""}</label>`,
                )
                .join("")
            : `<span class="faint" style="font-size:13px">Connect Hackatime above to link coding time.</span>`;
        return `
    <div class="form-grid panel">
      <div class="form-row">
        <label>NAME *</label>
        <input class="field" id="f-name" maxlength="120" value="${Pixl.esc(p.name || "")}" placeholder="What are you building?">
      </div>
      <div class="form-row">
        <label>DESCRIPTION</label>
        <textarea class="field" id="f-desc" maxlength="2000" placeholder="What it is, what it does… (Markdown supported)">${Pixl.esc(p.description || "")}</textarea>
      </div>
      <div class="two-col">
        <div class="form-row">
          <label>GITHUB REPO ${p.repo_url ? `<a class="open-link" href="${Pixl.esc(p.repo_url)}" target="_blank" rel="noopener">↗ open</a>` : ""}</label>
          <input class="field" id="f-repo" maxlength="500" value="${Pixl.esc(p.repo_url || "")}" placeholder="https://github.com/you/project">
        </div>
        <div class="form-row">
          <label>DEMO / PLAYABLE LINK ${p.demo_url ? `<a class="open-link" href="${Pixl.esc(p.demo_url)}" target="_blank" rel="noopener">↗ open</a>` : ""}</label>
          <input class="field" id="f-demo" maxlength="500" value="${Pixl.esc(p.demo_url || "")}" placeholder="https://…">
        </div>
      </div>
      <div class="form-row">
        <label>THUMBNAIL (required to ship)</label>
        <div class="thumb-box">
          <div class="thumb-preview" id="f-thumb-preview">${p.image_url ? `<img src="${Pixl.esc(p.image_url)}" alt="">` : ""}</div>
          <div style="display:flex;flex-direction:column;gap:8px">
            <button class="btn dark" id="f-thumb-btn" type="button">CHOOSE IMAGE</button>
            <input type="file" id="f-thumb-file" accept="image/png,image/jpeg,image/webp" hidden>
            <span class="faint" style="font-size:11px">or paste an image anywhere on this page</span>
          </div>
        </div>
      </div>
      <div class="form-row">
        <label>COMPLEXITY</label>
        <div class="level-row" id="f-levels">
          ${LEVELS.map(
            ([l, tip], i) => `
            <button type="button" class="level-btn ${(p.level || 1) === i + 1 ? "sel" : ""}" data-level="${i + 1}">${l}<small>${tip}</small></button>`,
          ).join("")}
        </div>
      </div>
      <div class="form-row">
        <label>TYPE (helps reviewers know how to run it)</label>
        <select class="field" id="f-type">
          ${[
            ["web", "Web Playable"],
            ["windows", "Windows Playable"],
            ["mac", "Mac Playable"],
            ["linux", "Linux Playable"],
            ["cross_platform", "Cross Platform Compatible"],
            ["python", "Python"],
            ["android", "Android Playable"],
            ["ios", "iOS Playable"],
            ["hardware", "Hardware"],
            ["cad", "CAD Models"],
            ["other", "Other / Not Sure"],
          ]
            .map(
              ([v, l]) =>
                `<option value="${v}" ${(p.project_type || "other") === v ? "selected" : ""}>${l}</option>`,
            )
            .join("")}
        </select>
      </div>
      <div class="form-row">
        <label>HACKATIME PROJECTS (proof of hours)<span class="teal" id="f-ht-total" style="margin-left:8px;font-size:12px;letter-spacing:0"></span></label>
        <div class="ht-pick">${htOpts}</div>
      </div>
      ${
        p.status === "approved" && !p.rejected_at
          ? `
      <div class="disclosure update">
        <label class="disclosure-check">
          <input type="checkbox" id="f-update" checked>
          This is an update to a shipped project
        </label>
        <p class="disclosure-desc">You already shipped this project, so this counts as an update. Tell reviewers what you added or changed since the last approval — a description is required to ship, and they'll only credit the new work.</p>
        <div class="form-row" id="f-update-notes-row">
          <label>WHAT DID YOU CHANGE? *</label>
          <div class="ta-wrap">
            <textarea class="field" id="f-update-notes" maxlength="2000" placeholder="Describe the new work (min 100 characters)."></textarea>
            <span class="ta-count" id="f-update-count">0 / 2000</span>
          </div>
        </div>
        <label class="disclosure-check" style="color:var(--dim)">
          <input type="checkbox" id="s-ysws">
          I already submitted this project to another Hack Club YSWS
        </label>
      </div>`
          : ""
      }
      <div class="disclosure">
        <label class="disclosure-check">
          <input type="checkbox" id="f-ai" ${p.used_ai ? "checked" : ""}>
          I used AI on this project
        </label>
        <p class="disclosure-desc">Tick this if AI was part of your workflow. Reviewers care less about the fact and more about what you did with the output — be honest and specific. Heavy AI use without your own polish gets rejected. Only you and reviewers see this, never the public.</p>
        <div class="form-row" id="f-ai-notes-row" ${p.used_ai ? "" : "hidden"}>
          <label>WHAT DID YOU USE AI FOR? *</label>
          <div class="ta-wrap">
            <textarea class="field" id="f-ai-notes" maxlength="500" placeholder="Which parts, which tools, how much…">${Pixl.esc(p.ai_notes || "")}</textarea>
            <span class="ta-count" id="f-ai-count">${(p.ai_notes || "").length} / 500</span>
          </div>
        </div>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn" id="f-save">${p.id ? "SAVE" : "CREATE PROJECT"}</button>
        <a class="btn dark" href="#">CANCEL</a>
      </div>
    </div>`;
      }

      function bindForm(p) {
        form = { level: p.level || 1, imageUrl: p.image_url || "" };
        $("f-levels").addEventListener("click", (e) => {
          const b = e.target.closest(".level-btn");
          if (!b) return;
          form.level = Number(b.dataset.level);
          document
            .querySelectorAll(".level-btn")
            .forEach((x) => x.classList.toggle("sel", x === b));
        });
        $("f-ai").addEventListener("change", () => {
          $("f-ai-notes-row").hidden = !$("f-ai").checked;
        });
        wireCount("f-ai-notes", "f-ai-count", 500);
        if ($("f-update")) {
          $("f-update").addEventListener("change", () => {
            $("f-update-notes-row").hidden = !$("f-update").checked;
          });
          wireCount("f-update-notes", "f-update-count", 2000);
        }
        $("f-thumb-btn").addEventListener("click", () =>
          $("f-thumb-file").click(),
        );
        $("f-thumb-file").addEventListener("change", () => {
          if ($("f-thumb-file").files[0]) setThumb($("f-thumb-file").files[0]);
        });
        $("f-save").addEventListener("click", () => saveProject(p));
      }

      function wireCount(taId, countId, max) {
        const ta = $(taId),
          c = $(countId);
        if (!ta || !c) return;
        const upd = () => {
          const n = ta.value.trim().length;
          c.textContent = `${n} / ${max}`;
          c.classList.toggle("full", n >= max);
        };
        ta.addEventListener("input", upd);
        upd();
      }

      async function setThumb(file) {
        Pixl.toast("Uploading image…");
        try {
          form.imageUrl = await Pixl.upload(file);
          $("f-thumb-preview").innerHTML =
            `<img src="${Pixl.esc(form.imageUrl)}" alt="">`;
          Pixl.toast("Thumbnail set!");
        } catch (e) {
          Pixl.toast(err(e.message), true);
        }
      }

      async function saveProject(p) {
        const body = {
          name: $("f-name").value.trim(),
          description: $("f-desc").value.trim(),
          repoUrl: $("f-repo").value.trim(),
          demoUrl: $("f-demo").value.trim(),
          imageUrl: form.imageUrl,
          level: form.level,
          usedAi: $("f-ai").checked,
          aiNotes: $("f-ai-notes").value.trim(),
          projectType: $("f-type") ? $("f-type").value : "other",
          hackatimeProjects: [
            ...document.querySelectorAll('input[name="ht"]:checked'),
          ].map((c) => c.value),
        };
        if (!body.name) {
          Pixl.toast(err("name_required"), true);
          return false;
        }
        $("f-save").disabled = true;
        const r = p.id
          ? await Pixl.send("PUT", `/api/projects/${p.id}`, body)
          : await Pixl.send("POST", "/api/projects", body);
        $("f-save").disabled = false;
        if (!r.ok) {
          Pixl.toast(err(r.error), true);
          return false;
        }
        Pixl.toast(p.id ? "Saved!" : "Project created!");
        await loadProjects();
        location.hash = "#p=" + r.project.id;
        return true;
      }

      /* ---------- project detail ---------- */

      async function renderProject(id) {
        const p = projects.find((x) => x.id === id);
        const view = $("view");
        if (!p) {

            return `
        <button class="ysws-pick" data-entry="${Pixl.esc(s.id)}">
          <span class="ysws-pick-name">${Pixl.esc(s.name)}</span>
          <span class="ysws-pick-meta">${meta}</span>
          ${s.description ? `<span class="ysws-pick-desc">${Pixl.esc(s.description.slice(0, 140))}</span>` : ""}
        </button>`;
          })
          .join("");
        const root = document.createElement("div");
        root.className = "ysws-modal";
        root.tabIndex = -1;
        root.innerHTML = `
      <div class="ysws-modal-veil"></div>
      <div class="ysws-modal-box" role="dialog" aria-modal="true">
        <div class="ysws-modal-title">IMPORT FROM ANOTHER YSWS</div>
        <div class="ysws-modal-body">
          Pick a project to bring in as a draft. Its links, description and thumbnail
          get filled in for you.
          <br><br>
          <strong>The hours it earned elsewhere don't carry over.</strong> Only new time
          you track from here counts toward what you're paid , your reviewer sees the
          earlier ship either way.
        </div>
        <div class="ysws-pick-list">${rows}</div>
        <div class="ysws-modal-acts"><button class="btn dark">CANCEL</button></div>
      </div>`;
        document.body.appendChild(root);
        root.focus();
        const close = () => root.remove();
        root.querySelector(".ysws-modal-veil").onclick = close;
        root.querySelector(".ysws-modal-acts .btn").onclick = close;
        root.addEventListener("keydown", (e) => {
          if (e.key === "Escape") close();
        });
        root.querySelectorAll("[data-entry]").forEach((btn) =>
          btn.addEventListener("click", async () => {
            btn.disabled = true;
            const r = await Pixl.send("POST", "/api/projects/import-ysws", {
              entryId: btn.dataset.entry,
            });
            if (r.ok && r.project) {
              close();
              Pixl.toast("Imported , add a thumbnail and start logging hours.");
              await loadProjects();
              await renderYswsImportBox();
              location.hash = `#p=${r.project.id}`;
              route();
            } else {
              btn.disabled = false;
              Pixl.toast(
                r.error === "already_imported"
                  ? "You've already imported that one."
                  : "Couldn't import that , try again.",
                true,
              );
            }
          }),
        );
      }

      function journalNeed(hours) {
        return hours > 0 ? Math.max(100, Math.round(hours * 100)) : 0;
      }

      function updateJournalHint() {
        const hint = $("j-hint");
        if (!hint) return;
        const len = $("j-content").value.trim().length;
        const need = journalNeed(Number($("j-hours").value) || 0);
        if (need === 0) {
          hint.textContent = len ? `${len} chars` : "";
          hint.classList.remove("bad", "ok");
          return;
        }
        hint.textContent = `${len} / ${need} chars`;
        hint.classList.toggle("bad", len < need);
        hint.classList.toggle("ok", len >= need);
      }

      function lockForm() {
        document
          .querySelectorAll(
            ".editor input, .editor textarea, .editor select, #f-save, #f-thumb-btn, .level-btn",
          )
          .forEach((el) => {
            if (
              el.id === "s-unship" ||
              el.closest(".composer") ||
              el.closest("#j-list") ||
              el.closest(".danger-zone")
            )
              return;
            el.disabled = true;
          });
        if ($("f-save")) $("f-save").textContent = "IN REVIEW — CAN'T EDIT";
      }

      async function unship(p) {
        if (
          !(await Pixl.confirm({
            title: "Unship this project?",
            body: "It leaves the review queue and goes back to a draft so you can edit it. You'll need to ship it again.",
            confirmText: "Unship",
          }))
        )
          return;
        $("s-unship").disabled = true;
        const r = await Pixl.send("POST", `/api/projects/${p.id}/unship`);
        $("s-unship").disabled = false;
        if (!r.ok) return Pixl.toast(err(r.error), true);
        Pixl.toast("Unshipped — it's a draft again, edit away.");
        await loadProjects();
        renderProject(p.id);
      }

      function shipBlockers(p, isUpdate) {
        const b = [];
        if (!p.repo_url) b.push("add a GitHub repo");
        if (!p.demo_url) b.push("add a demo / playable link");
        if (!p.image_url) b.push("upload a thumbnail");
        if (checkedHtSeconds() < 3600) b.push(htBlockerText());
        if (!$("s-eligible") || !$("s-eligible").checked)
          b.push("confirm this isn't a school assignment or paid Hack Club work");
        if (isUpdate) {
          const notes =
            $("f-update") && $("f-update").checked
              ? $("f-update-notes").value.trim()
              : "";
          if (notes.length < 100)
            b.push("describe what changed (100+ characters)");
        }
        if (
          ["draft", "needs_changes", "approved"].includes(p.status) ||
          p.rejected_at
        ) {
        } else b.push("this project can't be shipped right now");
        return b;
      }

      async function ship(p, isUpdate) {
        const body = {
          otherYsws: $("s-ysws") ? $("s-ysws").checked : false,
          eligibilityAttested: $("s-eligible") ? $("s-eligible").checked : false,
        };
        if (isUpdate && $("f-update") && $("f-update").checked)
          body.updateNotes = $("f-update-notes").value.trim();
        // 0 / absent tells the server this ship isn't for a Trial (clears any link).
        if ($("s-trial")) body.sidequestId = Number($("s-trial").value) || 0;
        $("s-ship").disabled = true;
        Pixl.toast("Checking your repo and demo…");
        const r = await Pixl.send("POST", `/api/projects/${p.id}/ship`, body);
        $("s-ship").disabled = false;
        if (!r.ok) {
          if (r.error === "trial_hours_below_minimum" && r.need != null)
            return Pixl.toast(
              `This Trial needs at least ${r.need}h tracked — you're at ${r.have}h.`,
              true,
            );
          return Pixl.toast(err(r.error), true);
        }
        Pixl.toast("SHIPPED! It's in the review queue.");
        await loadProjects();
        renderProject(p.id);
      }

      // [dot colour class, title]. The dot is a small node on the rail — the
      // event title already names the verdict, so no status word in the marker.
      const VERDICTS = {
        approved: ["ok", "Approved"],
        first_pass_approved: ["rev", "Passed first review"],
        needs_changes: ["warn", "Sent back for changes"],
        rejected: ["bad", "Rejected"],
      };

      function tlItem(dotClass, title, at, extra, note) {
        return `<div class="tl-item">
    <span class="tl-dot ${dotClass}"></span>
    <div class="tl-content">
      <div class="tl-head"><span class="tl-title">${title}</span><span class="tl-time">${Pixl.timeAgo(at)}</span></div>
      ${extra || ""}${note || ""}
    </div>
  </div>`;
      }

      function tlRow(e) {
        if (e.kind === "created")
          return tlItem("", "Project created", e.at, "", "");
        if (e.kind === "shipped")
          return tlItem("", "Shipped for review", e.at, "", "");
        const [icon, title] = VERDICTS[e.verdict] || ["rev", "Reviewed"];
        let hours = "";
        if (e.approvedHours != null) {
          const claimed = Number(e.claimedHours || 0);
          const appr = Number(e.approvedHours);
          const cut = Math.round((claimed - appr) * 10) / 10;
          hours = `<div class="tl-hours">Credited ${appr}h${claimed > appr ? ` of ${claimed}h claimed <span class="tl-cut">(−${cut}h)</span>` : ""}</div>`;
        }
        const note = e.note
          ? `<div class="tl-note">${Pixl.esc(e.note)}</div>`
          : "";
        return tlItem(icon, title, e.at, hours, note);
      }

      function autoGrow(el) {
        if (!el) return;
        el.style.height = "auto";
        el.style.height = el.scrollHeight + "px";
      }

      function mdApply(ta, action) {
        const s = ta.selectionStart,
          e = ta.selectionEnd,
          val = ta.value,
          sel = val.slice(s, e);
        const wrap = (before, after, ph) => {
          const text = sel || ph;
          ta.value = val.slice(0, s) + before + text + after + val.slice(e);
          ta.selectionStart = s + before.length;
          ta.selectionEnd = s + before.length + text.length;
        };
        const linePrefix = (pre) => {
          const ls = val.lastIndexOf("\n", s - 1) + 1;
          const nl = val.indexOf("\n", ls),
            le = nl === -1 ? val.length : nl;
          const line = val.slice(ls, le);
          const has = line.startsWith(pre);
          const newLine = has ? line.slice(pre.length) : pre + line;
          ta.value = val.slice(0, ls) + newLine + val.slice(le);
          const caret = Math.max(ls, s + (has ? -pre.length : pre.length));
          ta.selectionStart = ta.selectionEnd = caret;
        };
        switch (action) {
          case "bold":
            wrap("**", "**", "bold text");
            break;
          case "italic":
            wrap("*", "*", "italic text");
            break;
          case "code":
            sel.includes("\n")
              ? wrap("```\n", "\n```", "code")
              : wrap("`", "`", "code");
            break;
          case "h":
            linePrefix("# ");
            break;
          case "ul":
            linePrefix("- ");
            break;
          case "quote":
            linePrefix("> ");
            break;
          case "link": {
            const text = sel || "text",
              ins = `[${text}](url)`;
            ta.value = val.slice(0, s) + ins + val.slice(e);
            const u = s + text.length + 3;
            ta.selectionStart = u;
            ta.selectionEnd = u + 3;
            break;
          }
        }
        ta.focus();
        ta.dispatchEvent(new Event("input", { bubbles: true }));
      }

      function togglePreview() {
        const ta = $("j-content"),
          pv = $("j-preview"),
          btn = $("j-preview-btn");
        if (!pv.hidden) {
          pv.hidden = true;
          ta.hidden = false;
          btn.classList.remove("active");
          ta.focus();
          return;
        }
        const body = ta.value.trim();
        pv.innerHTML = body
          ? Pixl.markdown(body)
          : `<span class="faint">Nothing to preview yet.</span>`;
        pv.hidden = false;
        ta.hidden = true;
        btn.classList.add("active");
      }

      function initMdBar() {
        const bar = $("j-mdbar");
        if (!bar) return;
        bar.addEventListener("click", (ev) => {
          const b = ev.target.closest(".md-btn");
          if (!b) return;
          const a = b.dataset.md;
          if (a === "image") return $("j-img-file").click();
          if (a === "preview") return togglePreview();
          if (!$("j-preview").hidden) togglePreview();
          mdApply($("j-content"), a);
        });
        $("j-content").addEventListener("keydown", (ev) => {
          if (!(ev.ctrlKey || ev.metaKey)) return;
          const k = ev.key.toLowerCase();
          if (k === "b") {
            ev.preventDefault();
            mdApply($("j-content"), "bold");
          } else if (k === "i") {
            ev.preventDefault();
            mdApply($("j-content"), "italic");
          }
        });
      }

      async function loadTimeline(id) {
        let events = [];
        try {
          const d = await Pixl.api(`/api/projects/${id}/timeline`);
          events = d.events || [];
        } catch {}
        const list = $("tl-list");
        if (!list) return;
        list.innerHTML =
          events.length === 0
            ? `<div class="faint" style="font-size:13px;padding:8px">No history yet — ship it to start the timeline.</div>`
            : events.map(tlRow).join("");
      }

      async function loadJournal(id) {
        let entries = [];
        try {
          const d = await Pixl.api(`/api/projects/${id}/journal`);
          entries = d.entries || [];
        } catch {}
        const list = $("j-list");
        if (!list) return;
        list.innerHTML =
          entries.length === 0
            ? `<div class="faint" style="font-size:13px;text-align:center;padding:14px">No entries yet — journal as you build, reviewers read these.</div>`
            : entries
                .map(
                  (e) => `
      <div class="journal-entry panel">
        <div class="jmeta">
          <span>${Pixl.timeAgo(e.created_at)}</span>
          ${e.hours ? `<span class="teal">${Number(e.hours).toFixed(1)}h</span>` : ""}
          <button class="jdel" data-id="${e.id}">delete</button>
        </div>
        <div class="jbody md">${Pixl.markdown(e.content)}</div>
      </div>`,
                )
                .join("");
        list.querySelectorAll(".jdel").forEach((b) =>
          b.addEventListener("click", async () => {
            if (!(await Pixl.confirm({ title: "Delete this journal entry?", confirmText: "Delete", danger: true }))) return;
            const r = await Pixl.send(
              "DELETE",
              `/api/projects/${id}/journal/${b.dataset.id}`,
            );
            if (r.ok) {
              Pixl.toast("Entry deleted.");
              loadJournal(id);
            } else Pixl.toast(err(r.error), true);
          }),
        );
      }

      async function postJournal(id) {
        const content = $("j-content").value.trim();
        if (!content) return Pixl.toast("Write something first!", true);
        $("j-post").disabled = true;
        const r = await Pixl.send("POST", `/api/projects/${id}/journal`, {
          content,
          hours: Number($("j-hours").value) || 0,
        });
        $("j-post").disabled = false;
        if (!r.ok) {
          if (r.error === "journal_too_short")
            return Pixl.toast(
              `Logging ${r.hours}h needs ≥ ${r.need} characters (you have ${content.length}).`,
              true,
            );
          return Pixl.toast(err(r.error), true);
        }
        $("j-content").value = "";
        $("j-hours").value = "0";
        autoGrow($("j-content"));
        Pixl.toast("Entry posted!");
        loadJournal(id);
      }

      async function deleteProject(p) {
        if (
          !(await Pixl.confirm({
            title: "Delete this project?",
            body: `Delete "${p.name}" and all its journal entries? This can't be undone.`,
            confirmText: "Delete",
            danger: true,
          }))
        )
          return;
        if (
          !(await Pixl.confirm({
            title: "Really sure?",
            body: "Gone means gone.",
            confirmText: "Delete forever",
            danger: true,
          }))
        )
          return;
        const r = await Pixl.send("DELETE", `/api/projects/${p.id}`);
        if (!r.ok) return Pixl.toast(err(r.error), true);
        Pixl.toast("Project deleted.");
        await loadProjects();
        location.hash = "#";
      }

      /* ---------- paste-to-upload (thumbnail while editing) ---------- */

      document.addEventListener("paste", (e) => {
        const file = [...(e.clipboardData?.items || [])]
          .find((i) => i.type.startsWith("image/"))
          ?.getAsFile();
        if (!file) return;
        if (document.activeElement === $("j-content")) {
          e.preventDefault();
          Pixl.upload(file)
            .then((url) => {
              $("j-content").value +=
                ($("j-content").value ? "\n" : "") + `![](${url})`;
              autoGrow($("j-content"));
              Pixl.toast("Image attached!");
            })
            .catch((x) => Pixl.toast(err(x.message), true));
        } else if ($("f-thumb-preview")) {
          e.preventDefault();
          setThumb(file);
        }
      });

      /* ---------- router ---------- */

      function route() {
        if (!Pixl.hasToken) return;
        const h = location.hash.replace(/^#/, "");
        $("new-btn").style.display = "";
        if (h === "new") {
          $("new-btn").style.display = "none";
          $("view").innerHTML =
            `<a class="btn dark back-btn" href="#">← ALL PROJECTS</a><div class="editor">${trialBriefHtml(activeTrial)}${formHtml({})}</div>`;
          bindForm({});
          wireHtPicker();
          return;
        }
        if (h.startsWith("p=")) return renderProject(Number(h.slice(2)));
        renderList();
      }

      async function loadProjects() {
        const d = await Pixl.api("/api/projects");
        projects = (d.projects || []).map((p) => ({ ...p, id: Number(p.id) }));
      }

      async function loadTrials() {
        try {
          const d = await Pixl.api("/api/sidequests");
          // Only Trials the player has taken on and not yet finished can be a
          // ship target.
          trials = (d.quests || []).filter((q) => q.unlocked && !q.completed);
        } catch (e) {
          trials = [];
        }
        // The Trial the player arrived to build for: ?trial=<id> from the NPC, or
        // the single accepted Trial if there's exactly one. Drives the brief panel.
        const tid = Number(new URLSearchParams(location.search).get("trial"));
        activeTrial =
          (tid && trials.find((t) => Number(t.id) === tid)) ||
          (trials.length === 1 ? trials[0] : null);
      }

      // "Building for this Trial" brief — shown atop the new-project form and the
      // editor so the player builds to the Trial's spec.
      function trialBriefHtml(t) {
        if (!t) return "";
        return `
      <div class="trial-brief">
        <div class="trial-brief-h">BUILDING FOR TRIAL — ${Pixl.esc(t.name)}${t.region ? ` · ${Pixl.esc(t.region)}` : ""}</div>
        ${t.description ? `<p class="trial-brief-desc">${Pixl.esc(t.description)}</p>` : ""}
        ${t.reward ? `<div class="trial-brief-reward">Reward on completion: <b>${Pixl.esc(t.reward)}</b></div>` : ""}
        <div class="trial-brief-note">Build to this spec. When you ship, it's flagged for this Trial in the picker below (change it if you're building something else).</div>
      </div>`;
      }

      // The Trial to brief for a given project: its own linked Trial if set, else
      // the Trial the player arrived to work on.
      function trialForProject(p) {
        if (p && p.sidequest_id) {
          const linked = trials.find((t) => Number(t.id) === Number(p.sidequest_id));
          if (linked) return linked;
        }
        return activeTrial;
      }

      async function boot() {
        if (!Pixl.hasToken) return;
        try {
          const [s, elig] = await Promise.all([
            Pixl.api("/api/hackatime/stats"),
            Pixl.api("/api/profile/eligibility"),
            loadProjects(),
            loadTrials(),
          ]);
          stats = s.stats || null;
          hasBirthday = !!(elig && elig.ok && elig.birthday);
        } catch (e) {
          if (e.message !== "unauthorized")
            Pixl.toast("Couldn't reach the server.", true);
        }
        $("loading").remove();
        renderHt();
        loadPendingInvites();
        renderJoinCodeBox();
        renderYswsImportBox();
        route();
      }
      window.addEventListener("hashchange", route);
      boot();
    </script>
  </body>
</html>
