<style>
  .hero {
    padding: 26px 30px; margin-top: 8px; display: flex; align-items: flex-end; gap: 20px; flex-wrap: wrap;
  }
  .hero .page-sub { margin-bottom: 4px; color: var(--dim); }
  .tabs { display: flex; gap: 6px; margin: 22px 0 18px; flex-wrap: wrap; }
  .lb-subtabs { margin: 0 0 18px; }
  .lb-subtabs .tab { font-size: 13px; padding: 8px 14px 6px; }
  .tab {
    border: 1px solid var(--stroke); border-radius: var(--radius-sm);
    background: var(--panel);
    color: var(--dim);
    font-size: 15px;
    letter-spacing: 1px;
    padding: 10px 18px 8px;
    transition: border-color .15s ease, color .15s ease, background .15s ease;
  }
  .tab:hover { color: var(--gold); border-color: var(--gold) }
  .tab.active {
    background: var(--gold);
    color: var(--btn-ink);
    border-color: var(--gold);
  }
  .searchbar { display: flex; gap: 10px; margin-bottom: 18px; }
  .searchbar input { flex: 1; }
  .pcard { display: flex; flex-direction: column; align-items: center; gap: 9px; text-align: center; padding: 20px 14px 16px; }
  .avatar {
    width: 96px; height: 96px;
    border: 1px solid var(--stroke); border-radius: var(--radius);
    background: var(--panel-deep);
    display: flex; align-items: center; justify-content: center;
    font-size: 40px; color: var(--gold);
    overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .pcard .pname { font-size: 18px; color: var(--ink); word-break: break-word; }
  .pcard .pmeta { font-size: 13.5px; color: var(--faint); }
  .proj-card { display: flex; flex-direction: column; gap: 10px; padding: 14px 14px 16px; }
  .proj-thumb {
    height: 140px;
    border: 1px solid var(--stroke); border-radius: var(--radius-sm);
    background: var(--panel-deep);
    display: flex; align-items: center; justify-content: center;
    font-size: 40px;
    overflow: hidden;
  }
  .proj-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .proj-name { font-size: 18px; color: var(--ink); }
  .proj-meta { font-size: 13.5px; color: var(--faint); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .proj-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: auto; }
  .upvote-btn { display: inline-flex; align-items: center; gap: 5px; font-family: var(--pixel, inherit); font-size: 13px; font-weight: 600;
    color: var(--dim); background: var(--panel-2); border: 1px solid var(--stroke); border-radius: 999px; padding: 4px 11px; cursor: pointer;
    transition: color .12s ease, border-color .12s ease, background .12s ease, transform .08s ease; }
  .upvote-btn:hover:not(:disabled) { color: var(--gold); border-color: var(--gold); transform: translateY(-1px); }
  .upvote-btn.on { color: var(--btn-ink); background: var(--gold); border-color: var(--gold); cursor: default; }
  .upvote-btn:disabled { cursor: default; }
  .vote-group { display: inline-flex; align-items: center; gap: 6px; }
  .downvote-btn { display: inline-flex; align-items: center; gap: 5px; font-family: var(--pixel, inherit); font-size: 13px; font-weight: 600;
    color: var(--dim); background: var(--panel-2); border: 1px solid var(--stroke); border-radius: 999px; padding: 4px 11px; cursor: pointer;
    transition: color .12s ease, border-color .12s ease, background .12s ease, transform .08s ease; }
  .downvote-btn:hover:not(:disabled) { color: var(--bad); border-color: var(--bad); transform: translateY(-1px); }
  .downvote-btn.on { color: var(--btn-ink); background: var(--bad); border-color: var(--bad); cursor: default; }
  .downvote-btn:disabled { cursor: default; }
  .status-chip { text-transform: uppercase; }
  .board { display: flex; flex-direction: column; gap: 8px; }
  .board-row {
    display: flex; align-items: center; gap: 16px;
    padding: 12px 18px 10px;
    background: var(--panel);
    border: 1px solid var(--stroke); border-radius: var(--radius-sm);
    font-size: 16px;
  }
  .board-row .rank { width: 52px; color: var(--faint); font-size: 18px; }
  .board-row.top1 .rank { color: var(--gold); }
  .board-row.top2 .rank { color: #8a8f96; }
  .board-row.top3 .rank { color: #b5763a; }
  .board-row.you { border-color: var(--gold); }
  .board-row .bname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .board-row .bpx { color: var(--ink); display: flex; align-items: center; gap: 6px; }
  .board-row .bpx.px { color: var(--gold); }
  .board-row .bpx img { width: 15px; height: 15px; }
  .you-card { margin-top: 16px; padding: 14px 18px; display: flex; gap: 20px; align-items: center; flex-wrap: wrap; font-size: 15px; }
  .sprint-panel { margin-top: 26px; padding: 18px 20px; border-color: var(--stroke); }
  .sprint-panel h3 { color: var(--teal); font-size: 19px; margin-bottom: 4px; }
  .back-btn { margin-bottom: 18px; }
  .profile-head { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; padding: 24px; }
  .profile-head .avatar { width: 140px; height: 140px; font-size: 60px; }
  .profile-info { flex: 1; min-width: 240px; display: flex; flex-direction: column; gap: 10px; }
  .profile-info h2 { color: var(--gold); font-size: 30px; }
  .stat-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .stat {
    background: var(--panel-deep);
    border: 1px solid var(--stroke); border-radius: var(--radius-sm);
    padding: 10px 16px 8px;
    text-align: center;
  }
  .stat .v { color: var(--gold); font-size: 21px; }
  .stat .k { color: var(--faint); font-size: 12.5px; letter-spacing: 1px; }
  .section-h { font-size: 20px; color: var(--gold); margin: 28px 0 14px; letter-spacing: 1px; }
  .col-row { display: flex; flex-wrap: wrap; gap: 12px; }
  .coll { display: flex; align-items: center; gap: 10px; padding: 10px 14px; }
  .coll-thumb { width: 34px; height: 34px; border-radius: 8px; background: var(--panel-2); border: 1px solid var(--stroke);
    display: grid; place-items: center; color: var(--gold); overflow: hidden; flex-shrink: 0; }
  .coll-thumb img { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; }
  .coll-name { font-family: var(--pixel); font-size: 13px; color: var(--ink); }
  .journal { display: flex; flex-direction: column; gap: 12px; max-width: 780px; }
  .journal-entry { padding: 16px 18px; }
  .journal-entry .jmeta { font-size: 13px; color: var(--faint); margin-bottom: 8px; display: flex; gap: 12px; }
  .journal-entry .jbody { font-size: 15.5px; color: var(--ink); word-break: break-word; }
</style>
</head>
<body>
<main class="wrap">
  <section class="hero hud deep">
    <h1 class="page-title">EXPLORE</h1>
    <div class="page-sub">EVERY HACK CLUBBER, EVERY PROJECT, ONE LEADERBOARD.</div>
  </section>

  <div class="tabs" id="tabs">
    <button class="tab" data-view="players">PLAYERS</button>
    <button class="tab" data-view="projects">PROJECTS</button>
    <button class="tab" data-view="leaderboard">LEADERBOARD</button>
  </div>

  <div id="view"></div>
</main>

<script src="/pixl.js?v=2"></script>
<script>
Pixl.mountTopbar("explore");
Pixl.loadWallet();

const view = document.getElementById("view");
const cache = {};

function levelBadge(p) {
  return p.level != null ? `<span class="chip gold">LV ${p.level}</span>` : "";
}

function avatarHtml(p) {
  const letter = Pixl.esc(String(p.display_name || "?").trim().charAt(0).toUpperCase() || "?");
  let src = "";
  if (p.id && p.card_pixelate !== false)
    src = Pixl.apiUrl(`/api/pixify?user=${encodeURIComponent(p.id)}&size=48`);
  else if (p.avatar_url) src = String(p.avatar_url);
  if (!src) return `<div class="avatar">${letter}</div>`;
  return `<div class="avatar"><img src="${Pixl.esc(src)}" alt="" loading="lazy" onerror="this.parentNode.textContent='${letter}'"></div>`;
}

function statusChip(p) {
  const s = String(p.status || "draft");
  const map = { approved: "green", shipped: "teal", needs_changes: "red" };
  return `<span class="chip status-chip ${map[s] || ""}">${Pixl.esc(s.replace("_", " "))}</span>`;
}

// Reviewer-nominated standout project - cosmetic only, no payout effect.
function peakChip(p) {
  return p.is_peak
    ? `<span class="chip gold" title="Nominated as a standout project by a reviewer">★ PEAK</span>`
    : "";
}

function projCard(p) {
  return `
    <a class="card panel proj-card" href="#project=${Pixl.esc(p.id)}">
      <div class="proj-thumb">${p.image_url ? `<img src="${Pixl.esc(p.image_url)}" alt="" loading="lazy" onerror="this.remove()">` : ""}</div>
      <div class="proj-name">${Pixl.esc(p.name)}${p.is_peak ? " ★" : ""}</div>
      <div class="proj-meta">
        <span>by ${Pixl.esc(p.owner_name || "?")}</span>
        <span>${Pixl.timeAgo(p.created_at)}</span>
      </div>
      <div class="proj-foot">
        <span>${statusChip(p)}${peakChip(p)}${p.hackatime_seconds ? ` <span class="chip teal">${Pixl.hours(p.hackatime_seconds)}</span>` : ""}</span>
        <span class="vote-group">${upvoteBtn(p)}${downvoteBtn(p)}</span>
      </div>
    </a>`;
}

// Upvote pill. Permanent — once cast it disables and stays lit.
function upvoteBtn(p) {
  return `<button class="upvote-btn${p.has_upvoted ? " on" : ""}" onclick="return castVote(event,${Number(p.id)},'up')"${p.has_upvoted || p.has_downvoted ? " disabled" : ""} aria-label="Upvote this project" title="${p.has_upvoted ? "You upvoted this" : "Upvote this project"}">▲ <span class="uv-count">${p.upvotes || 0}</span></button>`;
}

// Downvote pill. Same permanent, one-shot behaviour as upvote.
function downvoteBtn(p) {
  return `<button class="downvote-btn${p.has_downvoted ? " on" : ""}" onclick="return castVote(event,${Number(p.id)},'down')"${p.has_upvoted || p.has_downvoted ? " disabled" : ""} aria-label="Downvote this project" title="${p.has_downvoted ? "You downvoted this" : "Downvote this project"}">▼ <span class="dv-count">${p.downvotes || 0}</span></button>`;
}

// Cast a permanent up/downvote without following the card link. Updates both
// buttons in place; the server is idempotent, rejects self-votes, and blocks
// voting the opposite direction if you've already voted the other way.
window.castVote = async function (e, id, dir) {
  e.preventDefault();
  e.stopPropagation();
  const btn = e.currentTarget;
  if (btn.disabled) return false;
  const group = btn.closest(".vote-group") || btn.parentElement;
  const upBtn = group ? group.querySelector(".upvote-btn") : null;
  const downBtn = group ? group.querySelector(".downvote-btn") : null;
  if (upBtn) upBtn.disabled = true;
  if (downBtn) downBtn.disabled = true;
  const r = await Pixl.send("POST", "/api/projects/" + id + "/" + (dir === "up" ? "upvote" : "downvote"));
  if (r.ok) {
    btn.classList.add("on");
    const c = btn.querySelector(dir === "up" ? ".uv-count" : ".dv-count");
    if (c) c.textContent = dir === "up" ? r.upvotes : r.downvotes;
  } else {
    if (upBtn) upBtn.disabled = false;
    if (downBtn) downBtn.disabled = false;
    const msg = r.error === "own_project" ? "You can't vote on your own project."
      : r.error === "already_upvoted" || r.error === "already_downvoted" ? "You've already voted on this project."
      : `Couldn't ${dir}vote right now.`;
    Pixl.toast(msg, true);
  }
  return false;
};

/* ---------- views ---------- */

async function showPlayers(q = "") {
  view.innerHTML = `
    <div class="searchbar"><input class="field" id="pq" type="search" placeholder="Find a player…" value="${Pixl.esc(q)}" autocomplete="off"></div>
    <div class="spin"></div>`;
  const input = document.getElementById("pq");
  let t;
  input.addEventListener("input", () => { clearTimeout(t); t = setTimeout(() => showPlayers(input.value.trim()), 350); });
  input.focus();

  const data = await Pixl.api("/api/explore/players" + (q ? "?q=" + encodeURIComponent(q) : ""));
  if (input.value.trim() !== q) return;
  const players = data.players || [];
  view.querySelector(".spin").remove();
  view.insertAdjacentHTML("beforeend", players.length === 0
    ? `<div class="empty-note">NOBODY HERE BY THAT NAME.</div>`
    : `<div class="grid">${players.map((p) => `
        <a class="card panel pcard" href="#player=${Pixl.esc(p.id)}">
          ${avatarHtml(p)}
          <div class="pname">${Pixl.esc(p.display_name)}</div>
          <div class="pmeta">${p.project_count} project${p.project_count === 1 ? "" : "s"} · joined ${Pixl.timeAgo(p.created_at)}</div>
        </a>`).join("")}</div>`);
}

async function showProjects(q = "") {
  view.innerHTML = `
    <div class="searchbar"><input class="field" id="jq" type="search" placeholder="Find a project…" value="${Pixl.esc(q)}" autocomplete="off"></div>
    <div id="showcase"></div>
    <div class="spin"></div>`;
  const input = document.getElementById("jq");
  let t;
  input.addEventListener("input", () => { clearTimeout(t); t = setTimeout(() => showProjects(input.value.trim()), 350); });

  const data = await Pixl.api("/api/explore/projects" + (q ? "?q=" + encodeURIComponent(q) : ""));
  if (input.value.trim() !== q) return;
  const projects = data.projects || [];
  view.querySelector(".spin").remove();
  view.insertAdjacentHTML("beforeend", projects.length === 0
    ? `<div class="empty-note">NO PROJECTS YET — GO MAKE THE FIRST ONE!</div>`
    : `<div class="grid">${projects.map(projCard).join("")}</div>`);
}

const LB_TABS = [
  { key: "pixels", label: "PIXELS" },
  { key: "referrals", label: "REFERRALS" },
  { key: "upvotes", label: "UPVOTES" },
];

function boardRow(p, unit) {
  return `
    <div class="board-row ${p.rank <= 3 ? "top" + p.rank : ""} ${p.you ? "you" : ""}">
      <span class="rank">${p.rank <= 3 ? ["#1", "#2", "#3"][p.rank - 1] : "#" + p.rank}</span>
      <span class="bname">${Pixl.esc(p.display_name)}${p.you ? ' <span class="gold">← YOU</span>' : ""}</span>
      <span class="bpx${unit === "PX" ? " px" : ""}">${unit === "PX" ? `<img src="/img/pixel.png" alt="">` : ""}${p.value.toLocaleString()} ${unit}</span>
    </div>`;
}

async function showLeaderboard(sub) {
  if (!LB_TABS.some((t) => t.key === sub)) sub = "pixels";
  view.innerHTML = `
    <div class="tabs lb-subtabs" id="lbTabs">${LB_TABS.map((t) => `<button class="tab${t.key === sub ? " active" : ""}" data-lb="${t.key}">${t.label}</button>`).join("")}</div>
    <div id="lbBody"><div class="spin"></div></div>`;
  document.querySelectorAll("#lbTabs [data-lb]").forEach((b) =>
    b.addEventListener("click", () => { location.hash = "#leaderboard=" + b.dataset.lb; }));
  const body = document.getElementById("lbBody");

  if (sub === "pixels") {
    const data = await Pixl.api("/api/explore/leaderboard");
    const rows = (data.players || []).map((p) => boardRow({ ...p, value: p.pixels }, "PX")).join("");
    const sprint = data.sprint ? `
      <div class="sprint-panel panel-deep">
        <h3>${Pixl.esc(data.sprint.name)}</h3>
        <div class="faint" style="font-size:12px;margin-bottom:12px">Pixels earned during the event only · ${Pixl.countdown(data.sprint.ends_at)}</div>
        <div class="board">${(data.sprint.players || []).map((p) => `
          <div class="board-row ${p.you ? "you" : ""}">
            <span class="rank">#${p.rank}</span>
            <span class="bname">${Pixl.esc(p.display_name)}${p.you ? ' <span class="gold">← YOU</span>' : ""}</span>
            <span class="bpx px">${p.pixels.toLocaleString()} PX</span>
          </div>`).join("") || '<div class="faint">No sprint pixels yet — be first!</div>'}
        </div>
        <div class="muted" style="font-size:13px;margin-top:10px">Your sprint total: ${Number(data.sprint.your_pixels || 0).toLocaleString()} PX</div>
      </div>` : "";
    body.innerHTML = `
      <div class="board">${rows || '<div class="empty-note">NO PIXELS ANYWHERE YET.</div>'}</div>
      <div class="you-card panel">
        <span class="gold">YOUR STANDING</span>
        <span>${data.yourRank ? "#" + data.yourRank : "UNRANKED"}</span>
        <span class="gold">${Number(data.yourPixels > 0 ? data.yourPixels : 0).toLocaleString()} PX</span>
        <span class="faint" style="font-size:12px">ship projects to climb</span>
      </div>
      ${sprint}`;
    return;
  }

  const endpoint = sub === "referrals" ? "/api/explore/leaderboard/referrals" : "/api/explore/leaderboard/upvotes";
  const unit = sub === "referrals" ? "PX" : "▲";
  const emptyMsg = sub === "referrals" ? "NO REFERRAL REWARDS PAID OUT YET." : "NO UPVOTES ANYWHERE YET.";
  const climbMsg = sub === "referrals" ? "refer friends to climb" : "ship great work to climb";
  const data = await Pixl.api(endpoint);
  const rows = (data.players || []).map((p) => boardRow(p, unit)).join("");
  body.innerHTML = `
    <div class="board">${rows || `<div class="empty-note">${emptyMsg}</div>`}</div>
    <div class="you-card panel">
      <span class="gold">YOUR STANDING</span>
      <span>${data.yourRank ? "#" + data.yourRank : "UNRANKED"}</span>
      <span class="${unit === "PX" ? "gold" : "teal"}">${Number(data.yourValue > 0 ? data.yourValue : 0).toLocaleString()} ${unit}</span>
      <span class="faint" style="font-size:12px">${climbMsg}</span>
    </div>`;
}

async function showPlayer(id) {
  view.innerHTML = `<div class="spin"></div>`;
  let data;
  try { data = await Pixl.api("/api/explore/players/" + encodeURIComponent(id)); }
  catch { view.innerHTML = `<div class="empty-note">PLAYER NOT FOUND.</div>`; return; }
  const p = data.player;
  const projects = data.projects || [];
  const collectibles = data.collectibles || [];
  view.innerHTML = `
    <button class="btn dark back-btn" onclick="location.hash='#players'">← ALL PLAYERS</button>
    <div class="profile-head panel">
      ${avatarHtml(p)}
      <div class="profile-info">
        <h2>${Pixl.esc(p.display_name)}</h2>
        <div class="stat-row">
          <div class="stat"><div class="v">LV ${p.level ?? 1}</div><div class="k">LEVEL</div></div>
          <div class="stat"><div class="v">${Number(p.xp_hours || 0).toFixed(1)}h</div><div class="k">APPROVED</div></div>
          <div class="stat"><div class="v">${projects.length}</div><div class="k">PROJECTS</div></div>
          <div class="stat"><div class="v">${Pixl.timeAgo(p.created_at)}</div><div class="k">JOINED</div></div>
        </div>
      </div>
    </div>
    ${collectibles.length ? `
    <div class="section-h">COLLECTIBLES</div>
    <div class="col-row">${collectibles.map(collChip).join("")}</div>` : ""}
    <div class="section-h">PROJECTS</div>
    ${projects.length === 0
      ? `<div class="empty-note">NOTHING SHIPPED YET.</div>`
      : `<div class="grid">${projects.map((pr) => projCard({ ...pr, owner_name: p.display_name })).join("")}</div>`}`;
}

// A collectible the player owns, shown as a small badge on their profile.
function collChip(c) {
  return `<div class="coll panel" title="${Pixl.esc(c.description || "")}">
    <div class="coll-thumb">${c.image_url ? `<img src="${Pixl.esc(c.image_url)}" alt="" onerror="this.remove()">` : "▲"}</div>
    <div class="coll-name">${Pixl.esc(c.name)}</div>
  </div>`;
}

async function showProject(id) {
  view.innerHTML = `<div class="spin"></div>`;
  let data;
  try { data = await Pixl.api("/api/explore/projects/" + encodeURIComponent(id)); }
  catch { view.innerHTML = `<div class="empty-note">PROJECT NOT FOUND.</div>`; return; }
  const p = data.project;
  const owner = data.owner;
  const entries = data.entries || [];
  view.innerHTML = `
    <button class="btn dark back-btn" onclick="history.length > 1 ? history.back() : location.hash='#projects'">← BACK</button>
    <div class="profile-head panel">
      <div class="proj-thumb" style="width:220px;height:160px;flex-shrink:0">${p.image_url ? `<img src="${Pixl.esc(p.image_url)}" alt="" onerror="this.remove()">` : ""}</div>
      <div class="profile-info">
        <h2>${Pixl.esc(p.name)}</h2>
        <div>${statusChip(p)}${peakChip(p)}
          ${p.hackatime_seconds ? `<span class="chip teal">${Pixl.hours(p.hackatime_seconds)} CODED</span>` : ""}
          ${p.level ? `<span class="chip">LEVEL ${p.level}</span>` : ""}
        </div>
        <div class="muted" style="font-size:14px">by ${owner ? `<a href="#player=${Pixl.esc(owner.id)}">${Pixl.esc(owner.display_name)}</a>` : "?"} · started ${Pixl.timeAgo(p.created_at)}${p.shipped_at ? ` · shipped ${Pixl.timeAgo(p.shipped_at)}` : ""}</div>
        <div class="vote-group" style="margin-top:12px">${upvoteBtn({ id: p.id, upvotes: data.upvotes, has_upvoted: data.has_upvoted, has_downvoted: data.has_downvoted })}${downvoteBtn({ id: p.id, downvotes: data.downvotes, has_upvoted: data.has_upvoted, has_downvoted: data.has_downvoted })}</div>
      </div>
    </div>
    ${p.description ? `<div class="jbody md" style="margin-top:16px;font-size:16px">${Pixl.markdown(p.description)}</div>` : ""}
    <div class="section-h">DEVLOG · ${entries.length} ENTR${entries.length === 1 ? "Y" : "IES"}</div>
    ${entries.length === 0
      ? `<div class="empty-note">NO JOURNAL ENTRIES YET.</div>`
      : `<div class="journal">${entries.map((e) => `
          <div class="journal-entry panel">
            <div class="jmeta"><span>${Pixl.timeAgo(e.created_at)}</span>${e.hours ? `<span class="teal">${Number(e.hours).toFixed(1)}h logged</span>` : ""}</div>
            <div class="jbody md">${Pixl.markdown(e.content)}</div>
          </div>`).join("")}</div>`}`;
}

/* ---------- hash router ---------- */

function route() {
  if (!Pixl.hasToken) return;
  const h = location.hash.replace(/^#/, "") || "players";
  const [key, val] = h.split("=");
  document.querySelectorAll(".tab").forEach((t) =>
    t.classList.toggle("active", t.dataset.view === (key === "player" ? "players" : key === "project" ? "projects" : key)));
  if (key === "player" && val) return showPlayer(decodeURIComponent(val));
  if (key === "project" && val) return showProject(decodeURIComponent(val));
  if (key === "projects") return showProjects();
  if (key === "leaderboard") return showLeaderboard(val);
  return showPlayers();
}

document.querySelectorAll(".tab").forEach((t) =>
  t.addEventListener("click", () => { location.hash = "#" + t.dataset.view; }));
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
